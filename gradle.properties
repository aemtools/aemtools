# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = aemtools
pluginName = AEM Tools
# SemVer format -> https://semver.org
pluginVersion = 1.0.8

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 243
pluginUntilBuild = 252.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformType = IC
platformVersion = 2024.3

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformPlugins =
platformBundledPlugins=org.intellij.intelliLang,com.intellij.java,com.intellij.modules.json

# Java language level used to compile sources and to generate the files for - Java 21 is required since 2024.2
javaVersion = 21
kotlinVersion = 1.9.20
kotlin.incremental=false

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 8.5

# Opt-out flag for bundling Kotlin standard library.
# See https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library for details.
# suppress inspection "UnusedProperty"
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# 3rd-party dependencies
gsonVersion=2.8.9
junit4Version=4.13.2
junitBomVersion=5.8.2
mockitoVersion=3.12.4
mockitoKotlinVersion=4.0.0
assertjVersion=3.21.0
spekVersion=1.1.5
jacocoVersion=0.8.8
apacheCommonsVersion=3.12.0
apacheCommonsTextVersion=1.13.1
contentPackageBuilderVersion=1.3.2
crxPackmgrHelper=1.3.0
detektVersion=1.23.5

# Build parameters
org.gradle.jvmargs=-Xmx4096m -Xms512m
